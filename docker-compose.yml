name: ldash

services:
  # Demo sandbox for https://laden.no/docker/ldash/ — empty DB, own volume
  api:
    build: ./api
    image: ldash-api:local
    environment:
      LDASH_ACCOUNT_DATA: /data
      LDASH_ACCOUNT_VAULTS: /data/vaults
      LDASH_ACCOUNT_BIND: 0.0.0.0:8741
      LDASH_ACCOUNT_PUBLIC: ${LDASH_PUBLIC_URL:-http://127.0.0.1:18084/docker/ldash/ldash}
    volumes:
      - ldash_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - ldash

  # MAIN account API for https://laden.no/ldash/ — copy of live data (not a bind of /var/lib/ldash)
  api-main:
    build: ./api
    image: ldash-api:local
    environment:
      LDASH_ACCOUNT_DATA: /data
      LDASH_ACCOUNT_VAULTS: /data/vaults
      LDASH_ACCOUNT_BIND: 0.0.0.0:8741
      LDASH_ACCOUNT_PUBLIC: https://laden.no/ldash
    volumes:
      - ldash_data_main:/data
    ports:
      - "127.0.0.1:8742:8741"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - ldash

  web:
    build: ./web
    image: ldash-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-18084}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - ldash

volumes:
  ldash_data:
    name: ldash_data
  ldash_data_main:
    name: ldash_data_main

networks:
  ldash:
    name: ldash
