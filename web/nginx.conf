server {
    listen 80;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 9m;

    location = / {
        return 302 /docker/ldash/;
    }

    location = /docker/ldash {
        return 301 /docker/ldash/;
    }

    # The demo's own account and vault API. The board's fixed cloud base
    # https://laden.no/ldash is rewritten to this path by demo-bridge.js,
    # so the demo never talks to the live service.
    location ^~ /docker/ldash/ldash/ {
        proxy_pass http://api:8741/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location ^~ /docker/ldash/ {
        alias /usr/share/nginx/html/ldash/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
